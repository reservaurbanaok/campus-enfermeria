<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard AEEPBA</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#060f1e;color:#fff}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;gap:15px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.card{background:#111e35;padding:15px;border-radius:10px}
.metric{font-size:24px;font-weight:bold}
.alert{color:#f87171}
input{width:100%;padding:8px;margin-bottom:10px;border-radius:6px;border:none;box-sizing:border-box}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.1)}
.badge{padding:3px 8px;border-radius:20px;font-size:12px}
.ok{background:#14532d;color:#4ade80}
.warn{background:#78350f;color:#fbbf24}
#loading{margin-bottom:10px;color:#8ba3c7}

/* Lock screen */
#lockScreen{
  position:fixed;inset:0;background:#060f1e;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;z-index:9999;gap:12px;
}
#lockScreen h2{margin:0;font-size:1.3rem;}
#lockScreen input{
  width:260px;padding:10px 14px;
  background:#111e35;border:1px solid rgba(255,255,255,0.15);
  border-radius:8px;color:#fff;font-size:1rem;outline:none;
}
#lockScreen input:focus{border-color:#2563eb;}
#lockScreen input.error{border-color:#f87171;animation:shake .3s ease;}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}
#lockScreen button{
  width:260px;padding:10px;border:none;border-radius:8px;
  background:#2563eb;color:#fff;font-size:1rem;font-weight:600;
  cursor:pointer;transition:background .2s;
}
#lockScreen button:hover{background:#1d4ed8;}
#errorMsg{color:#f87171;font-size:.85rem;margin:0;min-height:1.2em;}
</style>

</head>
<body>

<!-- 🔒 LOCK SCREEN -->
<div id="lockScreen">
  <h2>🔒 Acceso privado</h2>
  <input id="passwordInput" type="password" placeholder="Contraseña" />
  <button onclick="unlock()">Ingresar</button>
  <p id="errorMsg"></p>
</div>

<div class="container" id="app" style="display:none">

<h1>Dashboard Operativo</h1>
<p>Gestión en tiempo real</p>

<div class="grid grid-4">
<div class="card"><div>Alumnos</div><div id="m_alumnos" class="metric">0</div></div>
<div class="card"><div>Facturación</div><div id="m_total" class="metric">$0</div></div>
<div class="card"><div>Cobrado</div><div id="m_cobrado" class="metric">$0</div></div>
<div class="card"><div>Deuda</div><div id="m_deuda" class="metric">$0</div></div>
</div>

<br>

<div class="grid" style="grid-template-columns:2fr 1fr;">
<div class="card">
<h3>Cashflow</h3>
<canvas id="chart"></canvas>
</div>
<div class="card">
<h3>Alertas</h3>
<div id="alertas"></div>
</div>
</div>

<br>

<div class="card">
<h3>Base operativa</h3>
<div id="loading">Cargando datos...</div>
<input placeholder="Buscar alumno..." oninput="filterData(this.value)">
<table>
<thead>
<tr>
<th>Alumno</th><th>Curso</th><th>Total</th><th>Pagado</th><th>Saldo</th><th>Estado</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>

</div><!-- /app -->

<script src="config.js"></script>

<script>
// ── AUTH ──────────────────────────────────────────────
// Hash SHA-256 de "AEEPBA#2026"
const PWD_HASH = "55535d546278fdbb792ec4809d4d11dca418ff23bd5faf16cad8430c20744acb";

async function sha256(str) {
  const buf = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(str)
  );
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

async function unlock() {
  const input = document.getElementById("passwordInput");
  const hash  = await sha256(input.value);

  if (hash === PWD_HASH) {
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    fetchData();
  } else {
    document.getElementById("errorMsg").innerText = "Contraseña incorrecta";
    input.classList.add("error");
    setTimeout(() => input.classList.remove("error"), 400);
    input.value = "";
    input.focus();
  }
}

// Enter en el campo de contraseña
document.getElementById("passwordInput")
  .addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });

// ── HELPERS ───────────────────────────────────────────
let alumnos = [];
let chart;

function escH(s) {
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}
function moneda(n) {
  return "$" + Number(n||0).toLocaleString("es-AR");
}

// ── TABLA ─────────────────────────────────────────────
function render(data) {
  const tb = document.getElementById("tb");
  tb.innerHTML = "";
  data.forEach(a => {
    const total  = Number(a["Monto TOTAL"]  || 0);
    const pagado = Number(a["Monto PAGADO"] || 0);
    const saldo  = Number(a["Saldo"] || (total - pagado));
    tb.innerHTML += `
      <tr>
        <td>${escH(a["Apellido y Nombre"])}</td>
        <td>${escH(a["Curso"])}</td>
        <td>${moneda(total)}</td>
        <td>${moneda(pagado)}</td>
        <td class="${saldo > 0 ? "alert" : ""}">${moneda(saldo)}</td>
        <td><span class="badge ${saldo <= 0 ? "ok" : "warn"}">${saldo <= 0 ? "inscripto" : "deudor"}</span></td>
      </tr>`;
  });
}

function filterData(val) {
  const v = val.toLowerCase();
  render(alumnos.filter(a => (a["Apellido y Nombre"] || "").toLowerCase().includes(v)));
}

// ── MÉTRICAS ──────────────────────────────────────────
function metrics(data) {
  const total   = data.reduce((a,b) => a + Number(b["Monto TOTAL"]  || 0), 0);
  const cobrado = data.reduce((a,b) => a + Number(b["Monto PAGADO"] || 0), 0);
  const deuda   = total - cobrado;

  document.getElementById("m_alumnos").innerText = data.length;
  document.getElementById("m_total").innerText   = moneda(total);
  document.getElementById("m_cobrado").innerText = moneda(cobrado);
  document.getElementById("m_deuda").innerText   = moneda(deuda);

  return { total, cobrado };
}

// ── GRÁFICO ───────────────────────────────────────────
function renderChart(total, cobrado) {
  const ctx = document.getElementById("chart");

  if (chart) {
    chart.data.datasets[0].data = [total, cobrado];
    chart.update();
    return;
  }

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["Facturación", "Cobrado"],
      datasets: [{
        data: [total, cobrado],
        backgroundColor: ["#2563eb", "#16a34a"],
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => " " + moneda(ctx.parsed.y)
          }
        }
      },
      scales: {
        x: {
          ticks: { color: "#8ba3c7" },
          grid:  { color: "rgba(255,255,255,0.05)" },
          border:{ display: false }
        },
        y: {
          ticks: {
            color: "#8ba3c7",
            callback: v => moneda(v)
          },
          grid:  { color: "rgba(255,255,255,0.05)" },
          border:{ display: false }
        }
      }
    }
  });
}

// ── ALERTAS ───────────────────────────────────────────
function alertas(data) {
  const d = data.filter(a => Number(a["Saldo"]) > 0);
  document.getElementById("alertas").innerText =
    d.length > 0
      ? `⚠️ ${d.length} alumno${d.length > 1 ? "s" : ""} con deuda`
      : "✔ Sin deudores";
}

// ── FETCH ─────────────────────────────────────────────
async function fetchData() {
  try {
    const res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(CONFIG.API_URL));
    if (!res.ok) throw new Error();
    const data = await res.json();

    alumnos = data;
    render(alumnos);

    const { total, cobrado } = metrics(alumnos);
    renderChart(total, cobrado);
    alertas(alumnos);

    document.getElementById("loading").style.display = "none";

  } catch {
    document.getElementById("loading").innerText = "⚠️ Error cargando datos";
  }
}

// fetchData() se llama recién después del login exitoso
// El intervalo arranca también después del login
let intervalo;
const _origFetch = fetchData;
window.fetchData = function() {
  _origFetch();
  if (!intervalo) intervalo = setInterval(_origFetch, 30000);
};
</script>

</body>
</html>
